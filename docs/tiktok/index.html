<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion TikTok · Décodé Studio</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.6;background:#0f1218;color:#eee}code{display:block;word-break:break-all;background:#222;padding:12px;border-radius:8px;color:#ffd23f;font-size:15px}button{margin-top:12px;padding:10px 16px;font-size:16px}</style>
<h1>Connexion TikTok</h1><p id="m">Copie ce code et colle-le dans GitHub (Actions → « TikTok · connexion » → Run workflow) dans les 5 minutes :</p>
<code id="c">—</code><button onclick="navigator.clipboard.writeText(document.getElementById('c').textContent)">Copier</button>
<script>const p=new URLSearchParams(location.search);document.getElementById('c').textContent=p.get('code')||('Erreur : '+(p.get('error_description')||p.get('error')||'aucun code'));if(p.get('state'))document.getElementById('m').textContent+=' (compte : '+p.get('state')+')';</script></html>
